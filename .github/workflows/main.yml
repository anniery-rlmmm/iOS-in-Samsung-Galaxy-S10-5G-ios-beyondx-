name: Build HakiOS/Scion (Kernel + UEFI)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL HTTPS del repo del kernel'
        required: true
        default: 'https://github.com/Scion-Project/scion-kernel.git'
      uefi_repo:
        description: 'URL HTTPS del repo UEFI (ej. Mu-Silicium)'
        required: true
        default: 'https://github.com/Project-Silicium/Mu-Silicium.git'

jobs:
  build-xnu-kernel:
    runs-on: macos-15-intel
    steps:
      - name: Clonar repositorio del kernel
        run: git clone --recursive "${{ github.event.inputs.kernel_repo }}" scion-kernel

      - name: Ver dispositivos, SoCs y opciones de build
        working-directory: scion-kernel
        run: |
          echo "=== DEVICES ==="
          ls -la devices
          echo "=== SOCS ==="
          ls -la socs
          echo "=== PROFILES ==="
          ls -la profiles
          echo "=== USO DE xnu-build.sh ==="
          head -n 50 xnu-build.sh

      - name: Compilar kernel con xnu-build.sh
        working-directory: scion-kernel
        run: |
          chmod +x xnu-build.sh
          source ./xnu-env.sh || true
          ./xnu-build.sh

      - name: Subir binarios del kernel
        uses: actions/upload-artifact@v4
        with:
          name: scion-kernel-build
          path: |
            scion-kernel/BUILD/**/*kernel*
            scion-kernel/out/**/*
            scion-kernel/*.img
          if-no-files-found: warn

  build-uefi:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar dependencias de EDK2 / Mu-Silicium
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm \
            python3 python3-pip python3-venv gcc-aarch64-linux-gnu clang lld llvm g++ \
            mono-complete ca-certificates-mono
          sudo cert-sync /etc/ssl/certs/ca-certificates.crt

      - name: Clonar repositorio UEFI
        run: git clone --recursive "${{ github.event.inputs.uefi_repo }}" uefi-src

      - name: Ver dispositivos Samsung disponibles
        working-directory: uefi-src
        run: ls -la Platforms/Samsung || ls -la Platforms

      - name: Configurar entorno de Mu-Silicium
        working-directory: uefi-src
        run: |
          chmod +x setup_env.sh
          ./setup_env.sh || true
          pip3 install --break-system-packages -r pip-requirements.txt

      - name: Inspeccionar archivos de beyond1ltePkg
        working-directory: uefi-src
        run: find Platforms/Samsung/beyond1ltePkg -maxdepth 3

      - name: Compilar imagen UEFI base (beyond1lte)
        working-directory: uefi-src
        run: python3 build_uefi.py -d beyond1lte

      - name: Subir imagen UEFI compilada
        uses: actions/upload-artifact@v4
        with:
          name: uefi-beyond1lte
          path: |
            uefi-src/Build/**/*.img
            uefi-src/Mu-*.img
          if-no-files-found: warn
