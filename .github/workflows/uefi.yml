name: Build Mu-Silicium UEFI (beyondx)

on:
  workflow_dispatch:

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio Mu-Silicium
        uses: actions/checkout@v4
        with:
          repository: anniery-rlmmm/Mu-Silicium
          submodules: recursive

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl nasm git python3 python3-pip python3-venv \
            gcc-aarch64-linux-gnu clang lld llvm dos2unix device-tree-compiler \
            mono-devel curl unzip

      - name: Compilar UEFI para beyondx
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r pip-requirements.txt
          python3 build_uefi.py -d beyondx

      - name: Subir imagen UEFI compilada
        uses: actions/upload-artifact@v4
        with:
          name: uefi-beyondx-xnu
          path: |
            *.img
            Build/beyondxPkg/**/FV/BEYONDX_UEFI.fd
            Build/beyondxPkg/**/FV/SILICIUM_UEFI.fd
          if-no-files-found: warn
