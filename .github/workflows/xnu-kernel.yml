name: Build Scion iOS (beyondx)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL del repositorio del kernel Scion'
        required: true
        default: 'https://github.com/anniery-rlmmm/scion-kernel.git'

jobs:
  build-xnu-kernel:
    runs-on: macos-15-intel
    steps:
      - name: Instalar coreutils (solo sha256sum GNU)
        run: |
          brew install coreutils
          mkdir -p "$HOME/gnu-shims"
          ln -sf "$(brew --prefix coreutils)/bin/gsha256sum" "$HOME/gnu-shims/sha256sum"
          echo "$HOME/gnu-shims" >> $GITHUB_PATH

      - name: Clonar repositorio del kernel
        run: git clone --recursive "${{ github.event.inputs.kernel_repo }}" scion-kernel

      - name: Inspeccionar configuración de Exynos 9820
        working-directory: scion-kernel
        run: |
          echo "=== CONTENIDO DE socs/exynos9820 ==="
          ls -la socs/exynos9820
          echo "=== AYUDA DE defconfig Y kernel ==="
          grep -A 15 "^defconfig:" Makefile || true
          grep -A 15 "^kernel:" Makefile || true
          
      - name: Configurar y compilar kernel (Exynos 9820)
        working-directory: scion-kernel
        run: |
          echo "=== CONFIGS DE EXYNOS 9820 ==="
          ls -la socs/exynos9820/configs
          cat socs/exynos9820/soc.conf
          make exynos9820_defconfig || make defconfig FRAGMENTS=socs/exynos9820/configs/*
          make config
          rm -rf xnu-src
          make kernel

      - name: Compilar xnuloader (BOOTAA64.EFI)
        working-directory: scion-kernel
        run: |
         brew install lld
         export PATH="$(brew --prefix lld)/bin:$PATH"
         MKID=$(find . -maxdepth 3 -name "mkidentity.sh" | head -n 1)
         bash "$MKID" --placeholder
         make loader
         find . -iname "*.efi"
      
      - name: Buscar binarios generados
        working-directory: scion-kernel
        run: find . -maxdepth 6 \( -name "kernel*" -o -name "*.img" -o -name "*.macho" \) -type f

      - name: Subir xnuloader EFI
        uses: actions/upload-artifact@v4
        with:
          name: xnuloader-efi
          path: |
            **/*.efi
            
      - name: Subir binarios del kernel
        uses: actions/upload-artifact@v4
        with:
          name: scion-kernel-build
          path: |
            scion-kernel/**/BUILD/**/kernel*
            scion-kernel/**/build/**/*.img
            scion-kernel/**/*.img
            scion-kernel/**/*.macho
          if-no-files-found: warn
