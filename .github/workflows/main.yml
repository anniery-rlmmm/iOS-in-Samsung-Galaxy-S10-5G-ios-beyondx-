name: Build Scion iOS (beyondx)

on:
  workflow_dispatch:
    inputs:
      uefi_repo:
        description: 'URL de tu fork de Mu-Silicium'
        required: true
        default: 'https://github.com/anniery-rlmmm/Mu-Silicium.git'
      kernel_repo:
        description: 'URL del repositorio del kernel Scion'
        required: true
        default: 'https://github.com/Scion-Project/scion-kernel.git'

jobs:
  build-uefi:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar dependencias de EDK2 y Mu-Silicium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl git nasm python3-distutils \
            python3-pip python3-venv gcc-aarch64-linux-gnu llvm clang lld \
            mono-complete nuget ca-certificates-mono
          sudo cert-sync /etc/ssl/certs/ca-certificates.crt || true

      - name: Clonar fork de Mu-Silicium
        run: git clone --recursive "${{ github.event.inputs.uefi_repo }}" uefi-src

      - name: Instalar dependencias de Python
        working-directory: uefi-src
        run: pip3 install --break-system-packages -r pip-requirements.txt || true

      - name: Inspeccionar archivos de beyondxPkg
        working-directory: uefi-src
        run: find Platforms/Samsung/beyondxPkg -maxdepth 3

      - name: Compilar imagen UEFI (beyondx)
        working-directory: uefi-src
        run: python3 build_uefi.py -d beyondx

      - name: Subir imagen UEFI compilada
        uses: actions/upload-artifact@v4
        with:
          name: uefi-beyondx
          path: |
            uefi-src/Build/**/*.img
            uefi-src/Mu-*.img
          if-no-files-found: warn

  build-xnu-kernel:
    runs-on: macos-15
    steps:
      - name: Instalar coreutils (solo sha256sum GNU)
        run: |
          brew install coreutils
          mkdir -p "$HOME/gnu-shims"
          ln -sf "$(brew --prefix coreutils)/bin/gsha256sum" "$HOME/gnu-shims/sha256sum"
          echo "$HOME/gnu-shims" >> $GITHUB_PATH

      - name: Clonar repositorio del kernel
        run: git clone --recursive "${{ github.event.inputs.kernel_repo }}" scion-kernel

      - name: Compilar kernel
        working-directory: scion-kernel
        run: |
          rm -rf xnu-src
          make kernel || {
            echo "=== ULTIMAS LINEAS DE exporthdrs.log ==="
            tail -n 60 xnu-deps/exporthdrs.log || true
            exit 1
          }

      - name: Buscar binarios generados
        working-directory: scion-kernel
        run: find . -maxdepth 6 \( -name "kernel*" -o -name "*.img" -o -name "*.macho" \) -type f

      - name: Subir binarios del kernel
        uses: actions/upload-artifact@v4
        with:
          name: scion-kernel-build
          path: |
            scion-kernel/**/BUILD/**/kernel*
            scion-kernel/**/build/**/*.img
            scion-kernel/**/*.img
            scion-kernel/**/*.macho
          if-no-files-found: warn
